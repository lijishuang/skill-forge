<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill 工具</title>
<link rel="stylesheet" href="tool.css">
</head>
<body>
<header>
  <div class="logo">⚒</div>
  <div>
    <h1 id="hdTitle">Skill 工具</h1>
    <p id="hdDesc"></p>
  </div>
  <div class="hb" id="hdBadge">Skill 工坊 · 独立页面</div>
  <div class="langsw" id="langSw" data-noi18n style="margin-left:12px">
    <button data-l="zh">中文</button><button data-l="en">EN</button>
  </div>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2>输入参数 <span class="tag" id="fldTag"></span></h2>
      <form id="form"></form>
      <div class="btnrow">
        <button class="primary" id="btnRun" style="padding:9px 26px">▶ 执行</button>
        <button id="btnClear">清空</button>
        <button id="btnBack" class="hide">← 回到工坊</button>
      </div>
    </div>
    <div class="card">
      <h2>⚙ 模型配置</h2>
      <details open>
        <summary>OpenAI 兼容接口（只存在本机浏览器）</summary>
        <label class="f">API 地址（以 /v1 结尾）</label><input id="cBase" placeholder="https://api.deepseek.com/v1">
        <label class="f">API Key</label><input id="cKey" type="password" placeholder="sk-…">
        <label class="f">模型名称</label><input id="cModel" placeholder="deepseek-chat">
        <div class="host-row">
          <span id="hostDot" class="host-dot"></span>
          <span id="hostLabel" style="flex:1;min-width:180px">本地执行器：未检测</span>
          <button type="button" id="hostCheck">检测</button>
          <label><input type="checkbox" id="hostAuto"> 自动执行命令</label>
        </div>
      </details>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <h2>执行结果 <span class="tag" id="stat">待执行</span></h2>
      <div class="out" id="out">执行结果将在这里流式输出…</div>
      <div class="btnrow">
        <button id="btnCopy">复制</button>
        <button id="btnDl">下载 .md</button>
        <button id="btnRender" class="hide" title="在终端原样输出与 Markdown 渲染之间切换">📝 渲染</button>
      </div>
    </div>
  </div>
  <div class="col col-browser">
    <div class="card browser-card">
      <div class="browser-head">
        <h2>🌐 内嵌浏览器</h2>
        <span class="tag" id="bTag">不涉及</span>
      </div>
      <div class="browser-tip">执行结果若包含 HTML 页面，将在这里实时渲染；纯文本结果不涉及</div>
      <div id="bEmpty">
        <div class="big">🛰️</div>
        <b>不涉及</b>
        <span>该结果不包含 HTML 页面。<br>若输出中包含 HTML，将自动在此渲染预览。</span>
      </div>
      <iframe id="pv" class="hide" sandbox="allow-scripts allow-forms allow-popups allow-modals" title="内嵌浏览器"></iframe>
      <div class="btnrow hide" id="bBtns">
        <button id="btnOpenHtml" style="border-color:var(--accent);color:var(--accent);font-weight:600">🌐 新标签页打开</button>
        <button id="btnDlHtml">⬇ 下载 .html</button>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="tool.js"></script>
</body>
</html>
